# Based on GTSAM file (by @ProfFan)
name: CI Linux

on: [push, pull_request]

jobs:
  build:
    name: ${{ matrix.name }} ${{ matrix.build_type }}
    runs-on: ${{ matrix.os }}

    env:
      CTEST_OUTPUT_ON_FAILURE: ON
      CTEST_PARALLEL_LEVEL: 1
      VERBOSE: 1  # to show all cmake scripts debug info

    strategy:
      fail-fast: false
      matrix:
        # Github Actions requires a single row to be added to the build matrix.
        # See https://help.github.com/en/articles/workflow-syntax-for-github-actions.
        name: [
          ubuntu-latest-gcc
        ]

        build_type: [ Release ]
        include:
          - name: ubuntu-latest-gcc
            os: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@master

      - name: Install Dependencies
        run: |
          sudo apt-get -y update

          sudo apt-get install -y software-properties-common
          sudo add-apt-repository  ppa:joseluisblancoc/mrpt -y
          sudo apt-get update -qq

          sudo apt-get -y upgrade
          # libgtest-dev is required for the unit tests to be built and run;
          # without it tests/CMakeLists.txt skips the whole suite (ctest then
          # reports "No tests were found").
          sudo apt install -qq -y cmake build-essential libmrpt-dev libgtest-dev python3-pip

          # This repo is colcon-only (no standalone top-level CMake build);
          # colcon itself is pure Python, so pip avoids needing the ROS apt repo.
          pip3 install -U colcon-common-extensions

      - name: colcon build
        run: |
          colcon build --base-paths . \
            --event-handlers console_direct+ \
            --cmake-args -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} -DCMAKE_VERBOSE_MAKEFILE=ON

      - name: colcon test
        run: |
          colcon test --base-paths . --event-handlers console_direct+
          colcon test-result --all --verbose
